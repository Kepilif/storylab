    - text: Warsztat
      href: stories/nba_scouting_patterns/portfolio.qmd
    - text: Dalszy rozwój
      href: stories/nba_scouting_patterns/roadmap.qmd
format:
  html:
    css: assets/storylab.css
    toc: true
    number-sections: true
    code-fold: show
jupyter: storylab
execute:
  echo: true
  warning: false
  message: false
