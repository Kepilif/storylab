website:
  site-url: https://kepilif.github.io/storylab/
  title: StoryLab
  description: Historie oparte na danych — klienci, sport, gospodarka i klimat.
  navbar:
    left:
    - text: Start
      href: index.qmd
    - text: Projekty
      href: projects.qmd
    - text: Blog
      href: blog.qmd
    - text: Wizualizacje
      href: wizualizacje.qmd
    - text: O mnie
      href: about.qmd
  page-footer:
    left: StoryLab · Historie oparte na danych
    right:
    - text: E-mail
      href: mailto:jacek.filipek@gmail.com
    - text: GitHub
      href: https://github.com/Kepilif/
    - text: LinkedIn
      href: https://www.linkedin.com/in/kepilif/
    - text: Tableau Public
      href: https://public.tableau.com/app/profile/jacek.filipek/
    - text: GitLab
      href: https://gitlab.com/kepilif/
  sidebar:
  - style: docked
    contents:
    - stories/ecommerce_segmentation/index.qmd
