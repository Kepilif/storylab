      - stories/ecommerce_segmentation/01-wprowadzenie.qmd
      - stories/ecommerce_segmentation/02-dane.qmd
      - stories/ecommerce_segmentation/03-eda-dashboard.qmd
      - stories/ecommerce_segmentation/04-zachowania-w-czasie.qmd
      - stories/ecommerce_segmentation/reports/customer-segmentation.qmd
      - stories/ecommerce_segmentation/reports/market-basket-analysis.qmd
    - section: Metody i przebieg analizy
      contents:
      - stories/ecommerce_segmentation/05-analiza-koszykowa.qmd
      - stories/ecommerce_segmentation/06-rfm.qmd
      - stories/ecommerce_segmentation/07-kmeans.qmd
      - stories/ecommerce_segmentation/08-segmentacja-zachowan.qmd
      - stories/ecommerce_segmentation/09-profile-segmentow.qmd
    - section: Dokumentacja techniczna
      contents:
      - stories/ecommerce_segmentation/technical/appendix.qmd
      - stories/ecommerce_segmentation/technical/reproducibility.qmd
      - stories/ecommerce_segmentation/technical/dalszy-rozwoj.qmd
      - stories/ecommerce_segmentation/notebooks/interactive-notebook.qmd
      - stories/ecommerce_segmentation/12-ograniczenia.qmd
