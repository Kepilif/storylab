    title: Temperatura — prognoza i rzeczywistość
    style: docked
    contents:
    - text: O projekcie
      href: stories/globalne_ocieplenie/index.qmd
    - text: 1. Analiza FAOSTAT
      href: stories/globalne_ocieplenie/notebooks/01_temperature_change_analysis.qmd
    - text: 2. Prognoza kontra rzeczywistość
